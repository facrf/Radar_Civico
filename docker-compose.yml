services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: radar_civico:latest
    container_name: radar_civico
    ports:
      - "28080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=8080
      - WEB_DIR=/app/web/build
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
