name: Validar Radar Cívico
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Rust estável
        run: rustup update stable --no-self-update && rustup default stable
      - id: compiler
        run: echo "version=$(rustc -V | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - run: cargo check --workspace --locked
      - run: cargo test --all --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  docker:
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: radar-civico:ci
          build-args: |
            APP_VERSION=ci
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Conferir runtime em banco temporário
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker run -d --name radar-ci -p 28080:8080 radar-civico:ci
          trap 'docker logs radar-ci; docker rm -f radar-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:28080/ready; then
              curl -fsS http://localhost:28080/api/v1/config/versao | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["commit"] == os.environ["EXPECTED_COMMIT"], "Binário desatualizado na imagem"'
              exit 0
            fi
            sleep 2
          done
          exit 1
