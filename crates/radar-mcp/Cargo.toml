[package]
name = "radar-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radar-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
urlencoding = "2.1"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
