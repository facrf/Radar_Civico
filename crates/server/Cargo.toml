[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
storage = { path = "../storage" }
auditor = { path = "../auditor" }
ingestion = { path = "../ingestion" }
graph = { path = "../graph" }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
tower = "0.5"

[[test]]
name = "e2e_pipeline"
path = "../../tests/e2e_pipeline.rs"
